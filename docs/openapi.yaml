  "/ingestion/customers/csv":
    post:
      operationId: importCustomersCsv
      summary: Import customers CSV
      tags:
      - Ingestion
      description: ADMIN only. Asynchronous import with persisted progress and row-level errors. Multipart
        field name is file. CSV headers are snake_case; import customers before accounts
        before transactions.
      x-roles:
      - ADMIN
      responses:
        '202':
          description: Input persisted and queued; poll the Location URL for completion.
          headers:
