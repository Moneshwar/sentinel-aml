  "/transactions/batch":
    post:
      operationId: batchTransactions
      summary: Ingest a transaction batch
      tags:
      - Transactions
      description: 'ADMIN only. Returns a queued job; poll until COMPLETED or FAILED. Maximum 10000 records by default.'
      x-roles:
      - ADMIN
      responses:
        '202':
          description: Input persisted and queued; poll the Location URL for completion.
          headers:
            Location:
              description: Job status URL
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IngestionJobResponse"
        '413':
          description: Input exceeds the configured size or record limit
        '429':
          description: Import queue is full; retry later
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items:
                "$ref": "#/components/schemas/TransactionRequest"
  "/transactions/stream":
    post:
      operationId: streamTransaction
      summary: Ingest an idempotent transaction
      tags:
      - Transactions
      description: ADMIN only. First ingestion returns 201; replay of the same transactionRef
        returns its existing record with 200. Transaction persistence and detection
        commit atomically.
      x-roles:
      - ADMIN
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Problem"
        '200':
          description: Existing transaction replayed; no duplicate ingestion
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionRequest"
