  "/ingestion/jobs/{id}":
    get:
      operationId: getIngestionJob
      summary: Get import progress and final or partial results
      tags: [Ingestion]
      description: ADMIN only. COMPLETED may include rejected rows; FAILED may include committed rows. CSV totals are unknown until normal completion. Job ID also identifies the error-log batch.
      x-roles: [ADMIN]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
