---
openapi: 3.0.3
info:
  title: Sentinel AML API
  version: 1.1.0
  description: Static API contract for the implementation in this repository. Basic
    authentication is stateless. Backend-configured users are admin, analyst and viewer;
    credentials come from environment variables and are never included here. All list
    responses mask customer identifiers and sensitive narrative fields. Numeric customer
    IDs support the authorized by-id detail endpoint. VIEWER detail views remain redacted.
    CSV and JSON batch submission returns 202 with a durable job to poll. Detection
    occurs atomically for each processed transaction. No external
    SAR filing API is implemented.
servers:
- url: http://localhost:8080/api/v1
  description: Local development; use HTTPS for deployment
security:
- basicAuth: []
paths:
  "/admin/alerts/regenerate":
    get:
      operationId: previewAlertRegeneration
      summary: Preview stored transactions, alerts and case links before regeneration
      x-roles: [ADMIN]
      responses:
        '200':
          description: Current counts; counts may change before regeneration begins
          content:
            application/json:
              schema:
                type: object
                required: [transactions, alerts, caseLinks]
                properties:
                  transactions: {type: integer, format: int64}
                  alerts: {type: integer, format: int64}
                  caseLinks: {type: integer, format: int64}
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      operationId: regenerateAlerts
      summary: Replace all alerts using saved rules and all stored transactions
      x-roles: [ADMIN]
      description: >-
        Explicit demo rebuild, including reviewed alerts. Preserves transactions, customers,
        accounts, cases and audit history. Removes and audits existing case-alert links.
        New alerts have new references and start OPEN without assignments or dispositions.
        Uses original transaction timestamps and a saved rule snapshot. Atomic rollback
        preserves previous alerts and links on failure. PostgreSQL writes wait during the
        synchronous rebuild; reads remain available. No transaction ingestion is performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: [REGENERATE]}
      responses:
        '200':
          description: Rebuild committed successfully
          content:
            application/json:
              schema:
                type: object
                required: [transactionsEvaluated, alertsDeleted, alertsCreated, caseLinksRemoved]
                properties:
                  transactionsEvaluated: {type: integer, format: int64}
                  alertsDeleted: {type: integer, format: int64}
                  alertsCreated: {type: integer, format: int64}
                  caseLinksRemoved: {type: integer, format: int64}
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Problem"
  "/session":
    get:
      operationId: getSession
      summary: Verify credentials and return the current identity
      tags:
      - Session
      description: 'Allowed roles: ADMIN, ANALYST, VIEWER.'
