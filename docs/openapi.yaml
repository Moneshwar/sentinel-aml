      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: sort
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Repeat for multiple sorts, e.g. sort=riskScore,desc.
    post:
