        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Problem"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    KycStatus:
      type: string
      enum:
      - PENDING
      - VERIFIED
      - REJECTED
      - EXPIRED
    IngestionSource:
      type: string
      enum:
      - API
      - BATCH
      - BULK_CSV
      - STREAM
    AuditAction:
      type: string
      enum:
      - CREATED
      - UPDATED
      - STATUS_CHANGED
      - ASSIGNED
      - DISPOSITIONED
      - CLEARED
      - ESCALATED
    IngestionErrorType:
      type: string
      enum:
      - MALFORMED
      - VALIDATION
      - REFERENTIAL_INTEGRITY
      - DUPLICATE
      - PERSISTENCE
    Severity:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    CaseStatus:
      type: string
      enum:
      - OPEN
      - INVESTIGATING
      - PENDING_REVIEW
      - ESCALATED
      - SAR_FILED
      - CLOSED
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - DORMANT
      - CLOSED
      - FROZEN
      - SUSPENDED
    RiskRating:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    AlertStatus:
      type: string
      enum:
      - OPEN
      - IN_REVIEW
      - ESCALATED
      - CLEARED
      - CLOSED
    IngestionEntityType:
      type: string
      enum:
      - CUSTOMER
      - ACCOUNT
      - TRANSACTION
    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        transactionRef:
          type: string
        accountId:
          type: string
        customerId:
          type: string
        amount:
          type: number
        currency:
          type: string
        amountBase:
          type: number
        baseCurrency:
          type: string
        transactionType:
          type: string
        direction:
          type: string
        counterpartyName:
          type: string
        counterpartyAccount:
          type: string
        counterpartyCountry:
          type: string
        channel:
          type: string
        jurisdiction:
          type: string
        description:
          type: string
        transactionTime:
          type: string
          format: date-time
        ingestionSource:
          "$ref": "#/components/schemas/IngestionSource"
        createdAt:
          type: string
          format: date-time
    TransactionRequest:
      type: object
      properties:
        transactionRef:
          type: string
          maxLength: 100
          minLength: 1
        accountId:
          type: string
          maxLength: 64
          minLength: 1
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          maximum: 100000000000000000
          exclusiveMaximum: true
          description: Positive decimal amount with at most 17 integer digits and
            2 fractional digits.
        currency:
          type: string
          minLength: 1
          pattern: "^[A-Za-z]{3}$"
        transactionType:
          type: string
          maxLength: 30
        direction:
          type: string
          maxLength: 10
        counterpartyName:
          type: string
          maxLength: 255
        counterpartyAccount:
          type: string
          maxLength: 100
        counterpartyCountry:
          type: string
          maxLength: 3
        channel:
          type: string
          maxLength: 50
        jurisdiction:
          type: string
          maxLength: 3
        description:
          type: string
          maxLength: 500
        transactionTime:
          type: string
          format: date-time
      required:
      - transactionRef
      - accountId
      - amount
      - currency
      - transactionTime
    IngestionJobResponse:
      type: object
      required: [jobId, batchId, entityType, status, processed, succeeded, failed, createdAt, statusUrl]
      properties:
        jobId: {type: string}
        batchId: {type: string, description: Same as jobId}
        entityType: {type: string, enum: [CUSTOMER, ACCOUNT, TRANSACTION]}
        sourceName: {type: string, nullable: true}
        status: {type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED]}
        totalRecords: {type: integer, nullable: true, description: Unknown for CSV until normal completion}
        processed: {type: integer, minimum: 0}
        succeeded: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        finishedAt: {type: string, format: date-time, nullable: true}
        failureMessage: {type: string, nullable: true}
        statusUrl: {type: string}
        result:
          nullable: true
          description: Present on terminal job detail responses; partial on FAILED. Null while queued/running or in list entries.
          allOf:
          - "$ref": "#/components/schemas/IngestionResult"
    PageIngestionJobResponse:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/IngestionJobResponse"
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        last: {type: boolean}
    IngestionResult:
      type: object
      properties:
        batchId:
          type: string
        entityType:
          "$ref": "#/components/schemas/IngestionEntityType"
        sourceName:
          type: string
        totalRecords:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/IngestionErrorView"
      description: Synchronous per-record processing. totalRecords/succeeded/failed
        are full counts; errors contains at most 200 details. Successful records remain
        committed if other records fail.
    IngestionErrorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        batchId:
          type: string
        entityType:
          "$ref": "#/components/schemas/IngestionEntityType"
        sourceName:
          type: string
        sourceReference:
          type: string
        rawRecord:
          type: string
        errorType:
          "$ref": "#/components/schemas/IngestionErrorType"
        errorMessage:
          type: string
        occurredAt:
          type: string
          format: date-time
    IngestionErrorView:
      type: object
      properties:
        sourceReference:
          type: string
        errorType:
          "$ref": "#/components/schemas/IngestionErrorType"
        message:
          type: string
        rawRecord:
          type: string
    AlertStatusUpdateRequest:
      type: object
      properties:
        status:
          "$ref": "#/components/schemas/AlertStatus"
        assignedTo:
          type: string
          maxLength: 100
        disposition:
          type: string
          maxLength: 50
        dispositionReason:
          type: string
          maxLength: 4000
        actor:
          type: string
          description: Deprecated compatibility field. The server ignores this value
            and records the authenticated principal.
          deprecated: true
      required:
      - status
      description: Only ADMIN or ANALYST. Terminal records are immutable. dispositionReason
        is required for terminal transitions; authenticated principal is the audit
        actor.
    AlertResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        alertRef:
          type: string
        customerId:
          type: string
        accountId:
          type: string
        ruleCode:
          type: string
        triggeredRules:
          type: array
          items:
            type: string
        disposition:
          type: string
        dispositionReason:
          type: string
        title:
          type: string
        explanation:
          type: string
        riskScore:
          type: integer
          format: int32
        severity:
          "$ref": "#/components/schemas/Severity"
        status:
          "$ref": "#/components/schemas/AlertStatus"
        dedupKey:
          type: string
        assignedTo:
          type: string
        transactionRefs:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: List views redact customer/account identifiers and narrative fields;
        authorized detail responses contain explanation and dispositions. triggeredRules
        contains all combined rule codes.
    CaseCreateRequest:
      type: object
      properties:
        customerRef:
          type: string
        title:
          type: string
          maxLength: 255
          minLength: 1
        description:
          type: string
        priority:
          "$ref": "#/components/schemas/Severity"
        assignedTo:
          type: string
          maxLength: 100
        alertRefs:
          type: array
          items:
            type: string
        actor:
          type: string
          maxLength: 100
          description: Deprecated compatibility field. The server ignores this value
            and records the authenticated principal.
          deprecated: true
      required:
      - title
    CaseStatusUpdateRequest:
      type: object
      properties:
        status:
          "$ref": "#/components/schemas/CaseStatus"
        disposition:
          type: string
          maxLength: 50
        dispositionReason:
          type: string
          maxLength: 4000
        assignedTo:
          type: string
          maxLength: 100
        actor:
          type: string
          description: Deprecated compatibility field. The server ignores this value
            and records the authenticated principal.
          deprecated: true
      required:
      - status
      description: Only ADMIN or ANALYST. Terminal records are immutable. dispositionReason
        is required for terminal transitions; authenticated principal is the audit
        actor.
    CaseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        caseRef:
          type: string
        customerId:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          "$ref": "#/components/schemas/CaseStatus"
        priority:
          "$ref": "#/components/schemas/Severity"
        assignedTo:
          type: string
        disposition:
          type: string
        dispositionReason:
          type: string
        alertRefs:
          type: array
          items:
            type: string
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: string
        customerId:
          type: string
        accountType:
          type: string
        riskRating:
          "$ref": "#/components/schemas/RiskRating"
        accountStatus:
          "$ref": "#/components/schemas/AccountStatus"
        currency:
          type: string
        openDate:
          type: string
          format: date
        closeDate:
          type: string
          format: date
        branchCode:
          type: string
        branchCity:
          type: string
        currentBalance:
          type: number
        avgMonthlyBalance6m:
          type: number
        creditLimit:
          type: number
        creditUtilizationPct:
          type: number
        overdraftEnabled:
          type: boolean
        cardType:
