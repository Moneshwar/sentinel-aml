        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
