spring.datasource.url=jdbc:h2:mem:hackathon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

sentinel.base-currency=INR
sentinel.streaming.publisher=in-memory

logging.level.com.moneshwar.hackathon=WARN

# Tests explicitly drive the worker to keep job assertions deterministic.
sentinel.ingestion.worker-enabled=false
