spring.application.name=hackathon

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hackathon}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/bootstrap
spring.flyway.ignore-missing-migrations=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Ingestion / streaming configuration
sentinel.base-currency=INR
sentinel.streaming.publisher=in-memory

# Batch upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=500

logging.level.com.moneshwar.hackathon=INFO

server.port=8080

# Durable asynchronous imports: one application instance / one worker.
sentinel.ingestion.max-pending-jobs=20
sentinel.ingestion.max-batch-records=10000
sentinel.ingestion.max-input-bytes=52428800
sentinel.ingestion.poll-delay-ms=500
